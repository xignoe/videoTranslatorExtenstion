<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Video Translator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<h1>Video Translator</h1>
<div class="row">
  <label for="model">Model</label>
  <select id="model">
    <option value="tiny">Whisper tiny (fastest)</option>
    <option value="base" selected>Whisper base</option>
    <option value="small">Whisper small (most accurate)</option>
  </select>
</div>
<div class="row">
  <label for="source">Spoken language</label>
  <select id="source">
    <option value="auto" selected>Auto-detect</option>
  </select>
</div>
<div class="row">
  <label for="target">Caption language</label>
  <select id="target"></select>
</div>
<button id="toggle">Start</button>
<div id="status" class="idle"><span id="statusText">Ready</span></div>
<div id="detail">
  <div><span class="k">Backend</span><span id="backend">–</span></div>
  <div><span class="k">Detected language</span><span id="lang">–</span></div>
  <div><span class="k">Model download</span><span id="progress">–</span></div>
  <div><span class="k">Latency (median)</span><span id="latency">–</span></div>
  <div><span class="k">Last caption</span><span id="last">–</span></div>
</div>
<div id="warning" hidden></div>
<script src="popup.js"></script>
</body>
</html>
